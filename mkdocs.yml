site_name: Quality Engineering Learning Hub
site_description: Preparazione ISTQB e pratica di Quality Engineering in italiano
site_url: https://mr-jonam.github.io/ISTQB/
repo_url: https://github.com/mr-jonam/ISTQB
copyright: Progetto indipendente, non affiliato a ISTQB
use_directory_urls: true

theme:
  name: material
  language: it
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/catalogo.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: it

nav:
  - Home: index.md
  - Start Obsidian: 00-Start-Here.md
  - Certificazioni:
      - Catalogo completo: certificazioni/index.md
      - Core:
          - CTFL Foundation v4.0: certificazioni/core/ctfl.md
          - CTAL Agile Tester v2.0: certificazioni/core/ctal-at.md
          - CTAL Test Analyst v4.0: certificazioni/core/ctal-ta.md
          - CTAL Test Automation Engineering v2.0: certificazioni/core/ctal-tae.md
          - CTAL Test Management v3.0: certificazioni/core/ctal-tm.md
          - CTAL Technical Test Analyst: certificazioni/core/ctal-tta.md
      - Specialist - Tecnologie e approcci:
          - CT-AI AI Testing v2.0: certificazioni/specialist/tecnologie/ct-ai.md
          - CT-QDO Quality in DevOps: certificazioni/specialist/tecnologie/ct-qdo.md
          - CT-GenAI Testing with Generative AI: certificazioni/specialist/tecnologie/ct-genai.md
          - CT-MAT Mobile Application Testing: certificazioni/specialist/tecnologie/ct-mat.md
          - CT-MBT Model-Based Testing: certificazioni/specialist/tecnologie/ct-mbt.md
          - CT-TAS Test Automation Strategy: certificazioni/specialist/tecnologie/ct-tas.md
          - CT-ATLaS Agile Test Leadership at Scale: certificazioni/specialist/tecnologie/ct-atlas.md
      - Specialist - Qualita e livelli:
