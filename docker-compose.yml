name: istqb-learning-hub

services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istqb-learning-hub
    ports:
      - "127.0.0.1:8000:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
